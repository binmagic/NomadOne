# [INPUT]: Secrets DEPLOY_HOST / DEPLOY_SSH_PORT / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_PATH + github.ref_name
# [OUTPUT]: Runner checkout 后 scp 源码到远端，SSH 执行 scripts/release-remote.sh；远端不访问 GitHub
# [POS]: 唯一发布流水线；仅 tag v*；runner 上不 build、不推镜像
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Pack tree
        run: |
          tar \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.next-desktop' \
            --exclude='storage' \
            --exclude='prisma/dev.db' \
            --exclude='prisma/dev.db-*' \
            --exclude='.claude' \
            --exclude='dist-desktop' \
            --exclude='nomadone-release.tgz' \
            -czf nomadone-release.tgz .

      - name: Upload tree
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: nomadone-release.tgz
          target: /tmp
          overwrite: true

      - name: Compose on remote
        uses: appleboy/ssh-action@v1.2.2
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          envs: RELEASE_TAG,DEPLOY_PATH
          script: |
            set -euo pipefail
            mkdir -p "$DEPLOY_PATH"
            tar -xzf /tmp/nomadone-release.tgz -C "$DEPLOY_PATH"
            rm -f /tmp/nomadone-release.tgz
            bash "$DEPLOY_PATH/scripts/release-remote.sh" "$RELEASE_TAG"
