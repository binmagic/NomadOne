# [INPUT]: Secrets DEPLOY_HOST / DEPLOY_SSH_PORT / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_PATH + github.ref_name / github.repository
# [OUTPUT]: SSH 到远端；无 git 则 SSH clone，再检出 tag、清掉未跟踪的嵌套源码树，并执行 scripts/release-remote.sh
# [POS]: 唯一发布流水线；仅 tag v*；runner 上不 build、不推镜像；远端用 git@github.com，不走 HTTPS；git clean -fd 不带 -x，保留被 ignore 的 .env 与数据
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REPO_SSH: git@github.com:${{ github.repository }}.git
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          envs: RELEASE_TAG,DEPLOY_PATH,REPO_SSH
          script: |
            set -euo pipefail
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new"
            if [ ! -d .git ]; then
              git clone "$REPO_SSH" .
            fi
            git fetch --tags --force origin
            git checkout -f "$RELEASE_TAG"
            git clean -fd
            bash scripts/release-remote.sh "$RELEASE_TAG"
